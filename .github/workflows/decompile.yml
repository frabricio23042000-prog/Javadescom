name: Descompilar con Ghidra

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Ruta del .so dentro del repo"
        default: "input/libZyZGfx64.so"
  push:
    paths:
      - "input/**"

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Descargar Ghidra (ultima version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/g
          gh release download --repo NationalSecurityAgency/ghidra --pattern 'ghidra_*_PUBLIC_*.zip' --dir /tmp/g
          unzip -q /tmp/g/*.zip -d /tmp/g
          GH_HOME=$(ls -d /tmp/g/ghidra_*_PUBLIC)
          echo "GHIDRA_HOME=$GH_HOME" >> "$GITHUB_ENV"
          sed -i 's/^MAXMEM=.*/MAXMEM=5G/' "$GH_HOME/support/launch.properties"

      - name: Descompilar
        run: |
          FILE="${{ github.event.inputs.file }}"
          [ -z "$FILE" ] && FILE="input/libZyZGfx64.so"
          mkdir -p proj out
          "$GHIDRA_HOME/support/analyzeHeadless" proj p \
            -import "$FILE" \
            -scriptPath "$PWD/scripts" \
            -postScript DecompileAll.java "$PWD/out/decompiled.c" \
            -deleteProject 2>&1 | tee out/ghidra_log.txt
          python3 scripts/extract_strings.py "$FILE" out/strings_y_shaders.txt

      - name: Comprimir resultado
        run: cd out && zip -9 ../resultado.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: descompilado
          path: resultado.zip
